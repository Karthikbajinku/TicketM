<nav class="navbar" *ngIf="currentUser && !isLoginPage()">
  <div class="navbar-content">
    <div class="navbar-brand">
      <h3>IT Ticket System</h3>
    </div>

    <div class="navbar-center">
      <span class="role-badge" [ngClass]="getRoleClass()">
        {{ getUserRole() }}
      </span>
    </div>

    <div class="navbar-right">
      <span class="user-info">
        Welcome, {{ getUserName() }}
      </span>
      <button class="btn btn-outline logout-btn" (click)="logout()">
        Logout
      </button>
    </div>
  </div>
</nav>
